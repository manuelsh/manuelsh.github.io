      - generic [ref=f6e51]:
        - paragraph [ref=f6e52]:
          - generic [ref=f6e53]: 16th July 2026
        - heading "The problem" [level=1] [ref=f6e54]
        - paragraph [ref=f6e55]: I am helping a financial-services company become “AI-native”. I cannot share the name of the company; but many of the design choices we are making are general enough to be useful elsewhere.
        - paragraph [ref=f6e56]: "The natural temptation is to start by drawing the architecture: ingestion pipelines, databases, agent orchestration, evaluation systems, governance layers… However, before jumping into that we decided to agree on a set of principles that will guide the construction of the whole system."
        - paragraph [ref=f6e57]:
          - text: There are well established
          - link "software engineering principles" [ref=f6e58] [cursor=pointer]:
            - /url: https://www.computer.org/education/bodies-of-knowledge/software-engineering#overview
          - text: ", used across the industry for many years. There are also established"
          - link "Machine Learning Operations principles" [ref=f6e59] [cursor=pointer]:
            - /url: https://epub.uni-bayreuth.de/id/eprint/7577/1/Machine_Learning_Operations_MLOps_Overview_Definition_and_Architecture.pdf
          - text: to
          - link "build and scale AI systems" [ref=f6e60] [cursor=pointer]:
            - /url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
          - text: ". All this principles remain essential. Agentic systems, however, introduce a new design problem: model behavior, context, tools, and human oversight interact in ways those disciplines do not fully cover."
          - link "OpenAI" [ref=f6e61] [cursor=pointer]:
            - /url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
          - text: and
          - link "Anthropic" [ref=f6e62] [cursor=pointer]:
            - /url: https://www.anthropic.com/engineering/building-effective-agents
          - text: offer useful starting points, but companies still need principles that connect these systems to business processes, governance, and organizational change
        - paragraph [ref=f6e63]: Principles bring best practices, add coherence, they help decide which components are more important, where complexity and investment is justified, and what risks are acceptable. This is especially important when the system is built and maintained by different teams. In essence, if principles are well aligned, they reduce entropy, add coherence and focus.
        - blockquote [ref=f6e64]:
          - text: “
          - paragraph [ref=f6e65]: In essence, if principles are well aligned, they reduce entropy, add coherence and focus.
        - paragraph [ref=f6e66]: Principles should also be connected to the goal we are trying to achieve, either business goals, system stability, quality, safety, etc. In this article we focus on principles to build an AI-native company. These go beyond the agentic principles or pattern designs, and they need to address both the engineering and business side of the problem.
        - paragraph [ref=f6e67]: They are a starting point, but I don’t intend to be dogmatic. Principles should be adapted to the system and the circumstances around it, which can vary massively between companies and teams.
        - paragraph [ref=f6e68]: "Finally, while this article focuses on system design, projects like this also depend on a second major workstream: organizational transformation. This includes change management, training, operating model, culture, leadership alignment… Both the engineering track and the people transformation track should be managed as one coordinated effort, neither succeeds alone. I hope to share some of my learnings about organizational transformation in AI in a future article."
        - 'heading "Our circumstances: what AI-native really means" [level=1] [ref=f6e69]'
        - paragraph [ref=f6e70]: "The purpose of the project I am working on is to help transform a traditional business into an AI-native one. There are many definitions and interpretations of AI-native, but the one we will use is:"
        - paragraph [ref=f6e71]:
          - text: An
          - strong [ref=f6e72]: AI-native company
          - text: is a human-led, AI-operated organization in which every key business process is designed so that AI performs the greatest feasible share of its end-to-end execution.
        - paragraph [ref=f6e73]: This usually implies the redesign of many processes that will now go through an AI layer. AI stops being only a tool (a copilot) and becomes part of the company’s operating model (an autopilot).
        - paragraph [ref=f6e74]: This last phrase is strong, but it should not be misunderstood. I do not mean that AI becomes the decision-maker of the company. In fact one of the principles is about how we gradually give autonomy to the system.
        - paragraph [ref=f6e75]:
          - text: Why would a service business want to become AI-native? If done well, the AI agentic layers should drive measurable improvements in cost, quality or speed, or ideally, in all three (see
          - link "The AI-Native Services Playbook" [ref=f6e76] [cursor=pointer]:
            - /url: https://www.emcap.com/thoughts/the-ai-native-services-playbook
          - text: ). If these gains persist at scale, a service business may improve margins by reducing the human effort required per unit of output.
        - heading "What changes in practice" [level=2] [ref=f6e77]
        - paragraph [ref=f6e78]: "AI-native has significant implications for a business. Three things change in practice. First, the company needs to identify which parts of each key process AI can perform reliably now, and test the uncertain parts through feasibility experiments. Second, it needs a technology stack that provides the right context, tools, evaluation, and controls for those redesigned processes, addressed in this article. Third, it needs to transform the organization around them: bring employees in, train them, establish ownership and access controls, and measure both adoption and business outcomes."
        - paragraph [ref=f6e79]: "AI-native implies building the following interacting components:"
        - paragraph [ref=f6e80]:
          - strong [ref=f6e81]: "(1) Context management layer:"
          - text: mechanisms for capturing, governing and retrieving the information (structured and unstructured) that the agents need, including documents, meeting records, decisions, objectives, operational data…
        - paragraph [ref=f6e82]:
          - strong [ref=f6e83]: "(2) Agentic system(s) that perform the company’s core work:"
          - text: The company’s main processes will be redesigned around AI, drawing on the context layer. This will likely require distinct sets of systems for sales, marketing, customer service, production, and other functions, which need to be interconnected.
        - paragraph [ref=f6e84]: "Additionally, there are two other components that can enhance the speed of the system transformation and of the company itself:"
        - paragraph [ref=f6e85]:
          - strong [ref=f6e86]: (3) Feedback loop
          - text: ": mechanisms for collecting evidence from evals, human review, and production outcomes, then using it to propose, test and approve improvements."
        - paragraph [ref=f6e87]:
          - strong [ref=f6e88]: (4) Ability to query
          - text: ": The whole company should become more queryable, inside and across teams. This requires interfaces and access management for both agents and users."
        - paragraph [ref=f6e89]:
          - text: Y Combinator also offers
          - link "useful guides" [ref=f6e90] [cursor=pointer]:
            - /url: https://www.ycombinator.com/library/OX-the-playbook-for-building-an-ai-native-company
          - text: on becoming AI-native. I agree with its emphasis on rapid experimentation, although I would treat token consumption as an activity metric rather than evidence of business value.
        - heading "An example" [level=2] [ref=f6e91]
        - paragraph [ref=f6e92]: Let’s imagine a company that produces and maintains software. “AI as a tool” would simply provide all developers with access to AI agents while leaving the development process unchanged. But AI as an operating system (an AI-native company) means redesigning the whole development process so that AI agents perform as much of the work as possible, with the level of human supervision depending on the risk involved and the proven reliability of the AI system.
        - paragraph [ref=f6e93]: "For this to work, all relevant information needs to become useful context for the agents: the objectives of each team, roadmap, codebase and architecture, engineering principles, previous decisions, what has and has not worked… Based on this context, agents could suggest what to build next, prepare plans, create prototypes, implement approved changes, monitor the results, and feed what they learn back into the system. Anyone with the appropriate permissions should also be able to ask what a team is building, why a decision was made, what risks exist, or what is preventing a release."
        - paragraph [ref=f6e94]: "The role of the employees would change. Product managers and engineers set objectives, make important trade-offs, approve high-risk decisions, and handle exceptions. A Product Manager could build and validate a prototype without waiting for an engineering team. Engineers could supervise several agents, review their architectural and implementation decisions, and improve the context, tools, and evaluations that determine the quality of their work. Some team rituals may also change: planning meetings, for example, could be prepared by AI. The whole development process would be organized around one question: how do we reduce the distance between an identified need and a solution in production?"
        - blockquote [ref=f6e95]:
          - text: “
          - paragraph [ref=f6e96]: "The whole development process would be organized around one question: how do we reduce the distance between an identified need and a solution in production?"
        - paragraph [ref=f6e97]: All of this requires architectural and process decisions that will not emerge simply from bottom-up adoption of AI tools. It requires deliberate design, an experimentation mindset, and coordination across the company. Leadership needs to understand what is possible with AI, decide where AI can act autonomously and where human approval remains necessary, and transform the company so that it can execute this change. The principles in the next section make the main design decisions of that operating model explicit.
        - heading "A set of principles for AI-native companies" [level=1] [ref=f6e98]
        - paragraph [ref=f6e99]: "The principles below fall into two groups. The first are operating-model principles: establish context and ownership before agents, make the company queryable, and build a continuous-improvement loop. The second are reliability principles: measure a baseline, earn autonomy, secure the system, prefer deterministic logic where possible, and establish clear sources of truth."
        - heading "Operating-model principles" [level=2] [ref=f6e100]
        - heading "Establish context and ownership before agents" [level=3] [ref=f6e101]
        - heading "Why this principle" [level=4] [ref=f6e102]
        - paragraph [ref=f6e103]: The company’s agentic layer will be only as good as the context it has. A sophisticated agentic system built on incoherent context will only produce wrong answers. This is why the context layer must be treated as strategic
        - blockquote [ref=f6e104]:
          - text: “
          - paragraph [ref=f6e105]: The company’s agentic layer will be only as good as the context it has.
        - heading "What it implies in practice" [level=4] [ref=f6e106]
        - paragraph [ref=f6e107]: "The first step is to design proper ways of capturing, storing and retrieving context. This means answering questions such as:"
        - list [ref=f6e108]:
          - listitem [ref=f6e109]:
            - paragraph [ref=f6e110]: How do we capture and store the content of a meeting?
          - listitem [ref=f6e111]:
            - paragraph [ref=f6e112]: How do we store company decisions?
          - listitem [ref=f6e113]:
            - paragraph [ref=f6e114]: What about databases with client information?
          - listitem [ref=f6e115]:
            - paragraph [ref=f6e116]: How do we give coherence to all of it?
        - paragraph [ref=f6e117]: Treating data (the context) as a first-class citizen is strategic, not only because data is an important company asset, but also because the subsequent agentic layer built on top of it will only perform if it has the right context.
        - paragraph [ref=f6e118]:
          - text: "It is also important to assign owners to each strategic data asset. I strongly recommend adopting the “data as a product” paradigm: treating data as something designed and maintained for specific consumers and use cases, with explicit ownership, documentation, quality, access controls… This makes the data more reliable and useful for both people and AI agents. This paradigm shift is not trivial in complex organizations with a lot of legacy. That is a matter for"
          - link "another book" [ref=f6e119] [cursor=pointer]:
            - /url: https://www.amazon.com/-/es/Team-Topologies-2nd-Organizing-Technology/dp/1966280009/
          - text: .
        - paragraph [ref=f6e120]: On the data layer one should not become stuck with a company wide program before value is delivered. Do it iteratively, adding value at each step. Start each agentic workflow by establishing the minimum reliable context it needs, with explicit owners, quality expectations, and access controls. Then improve that context as the workflow reveals gaps.
        - paragraph [ref=f6e121]: I discuss data further in the “one single source of truth” principle.
        - heading "The whole system should be queryable" [level=3] [ref=f6e122]
        - heading "Why this principle" [level=4] [ref=f6e123]
        - paragraph [ref=f6e124]: One key feature of an AI-native company is the ability to ask questions across organizational boundaries through agents. To make this trustworthy, answers should show where the information came from, when it was last updated, and where uncertainty or conflicting sources remain. This is critical because it brings clarity and speed.
        - blockquote [ref=f6e125]:
          - text: “
          - paragraph [ref=f6e126]: One key feature of an AI-native company is the ability to ask questions across organizational boundaries through agents.
        - heading "What it implies in practice" [level=4] [ref=f6e127]
        - paragraph [ref=f6e128]: "Every strategic data set (and by strategic I mean: start by the most valuable datasets) should have an owner, documented meaning and interfaces, access control policies, lineage, and measurable expectations for freshness, completeness, accuracy, and availability (think about a data service level agreement). These measurements could be implemented in the form of evals. Its users, people or agents, should also know when those expectations are not being met."
        - paragraph [ref=f6e129]: Again, elements from the “data as a product” paradigm can help a lot here. Data catalogs, data interoperability software and data quality systems are some of the foundations needed.
        - paragraph [ref=f6e130]:
          - text: On top of that, the company needs an agentic layer that can access the right data, speak to other agents, or connect to the right tools. This could be implemented through protocols such as
          - link "A2A" [ref=f6e131] [cursor=pointer]:
            - /url: https://developers.googleblog.com/en/a2a-a-new-era-of-agent-interoperability/
          - text: ", through tools exposed via"
          - link "MCP" [ref=f6e132] [cursor=pointer]:
            - /url: https://modelcontextprotocol.io/docs/getting-started/intro
          - text: ", or through other implementation choices. The advice provided in the"
          - link "OpenAI" [ref=f6e133] [cursor=pointer]:
            - /url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
          - text: practical agentic guide about setting up the tools and orchestrating the agents can be very useful.
        - heading "Build a continuous-improvement loop" [level=3] [ref=f6e134]
        - heading "Why this principle" [level=4] [ref=f6e135]
        - paragraph [ref=f6e136]: An AI-native system should have a loop to improve itself. This is critical because agentic systems will not be perfect from the start, and their quality will depend on how well they learn from evals, human feedback, production behavior and changing business needs.
        - heading "What it implies in practice" [level=4] [ref=f6e137]
        - paragraph [ref=f6e138]: "This usually requires three general capabilities, which should run parallel to each core agentic system:"
        - list [ref=f6e139]:
          - listitem [ref=f6e140]:
            - paragraph [ref=f6e141]: "Feedback capture: The system needs to capture and store the results of evals and feedback from humans in the loop."
          - listitem [ref=f6e142]:
            - paragraph [ref=f6e143]: An improvement workflow that turns captured feedback into proposed changes, for example through pull requests.
          - listitem [ref=f6e144]:
            - paragraph [ref=f6e145]: Governance for review, approval, documentation and user communication.
        - paragraph [ref=f6e146]: "The change proposal can be of any kind: architecture, missing data inputs, better prompts, improved evals, better documentation, or changes in the workflow."
        - paragraph [ref=f6e147]: One possible way to do this is to set up a daily or weekly loop that reviews the feedback, builds a PR, and has that PR reviewed and approved by the system owners and a power user.
        - paragraph [ref=f6e148]: My recommendation is to start implementing the feedback loop in smaller subsystems before scaling it to the rest of the system, starting with one where the added value is significant.
        - heading "Reliability principles" [level=2] [ref=f6e149]
        - heading "Measure a quality baseline before automating a process" [level=3] [ref=f6e150]
        - heading "Why this principle" [level=4] [ref=f6e151]
        - paragraph [ref=f6e152]: You will most probably use AI to enhance core processes. Before doing that, my recommendation is to understand the current quality level of the process.
        - paragraph [ref=f6e153]: By ‘quality level’, I mean a small scorecard that captures main metrics, such as outcome, cost, speed, safety… of the current process, including how these vary across relevant customer and case segments. A single average can hide the failures that matter most.
        - paragraph [ref=f6e154]: This is important, because we want to automate while maintaining or improving the current quality level.
        - heading "What it implies in practice" [level=4] [ref=f6e155]
        - paragraph [ref=f6e156]: In practice, this means starting by collecting current quality metrics, or building systems to measure them if they are not available, before automating a process.
        - paragraph [ref=f6e157]: AI can provide new ways of doing this. For example, imagine a clinic that wants to automate incoming calls using agents. Before automation, AI can transcribe the current service calls, and LLMs can help judge whether the caller question was resolved, if the answers provided comply with certain criteria, or even whether the emotion of both speakers suggests a good or bad interaction.
        - paragraph [ref=f6e158]: This gives the company a baseline against which the new AI-based process can be compared.
        - heading "Evals, human-in-the-loop and continuous monitoring come before autonomy" [level=3] [ref=f6e159]
        - heading "Why this principle" [level=4] [ref=f6e160]
        - paragraph [ref=f6e161]: Once we have a quality baseline, we must evaluate the results of the new agentic workflows to ensure they are at the desired level.
        - paragraph [ref=f6e162]: Autonomy should be earned gradually, not granted to an agent as a whole. A system should not be allowed to take important actions by itself just because it performs well in a demo or in a few selected examples. The system should also lose autonomy when quality degrades or an incident occurs.
        - blockquote [ref=f6e163]:
          - text: “
          - paragraph [ref=f6e164]: Autonomy should be earned gradually.
        - heading "What it implies in practice" [level=4] [ref=f6e165]
        - paragraph [ref=f6e166]: "There are three main ways to do this: evals, human-in-the-loop, and production monitoring."
        - paragraph [ref=f6e167]: Evals are ways of measuring the quality of the output of the agentic system or its parts. For example, one can evaluate deterministically whether a document has a certain format or contains specific fields. We can also evaluate whether it contains certain topics or whether the style falls under defined specifications using AI, for example with a classification model or an LLM-as-a-judge.
        - paragraph [ref=f6e168]: We should also set error targets for these evals, and have systems that capture the errors and the corresponding inputs so they can serve as feedback loops.
        - paragraph [ref=f6e169]: Human-in-the-loop is a common design pattern in agentic systems where a human needs to provide input before the system continues. It is commonly used in critical systems when it is hard to evaluate the quality of the output systematically, or when the team does not trust the system yet.
        - paragraph [ref=f6e170]: An example could be an AI agent that writes messages to customers on behalf of a person. That person will most likely want to review the messages, at least until there is enough evidence that the quality is high enough.
        - paragraph [ref=f6e171]: As with evals, one should always build a system to capture the feedback given. Did the human accept the proposal? If not, capture the output of the agent, the output of the human after modifications, and, if possible, brief feedback from the human explaining what was wrong.
        - blockquote [ref=f6e172]:
          - text: “
          - paragraph [ref=f6e173]: Quality should be continuously observed and improved, not only before launch.
        - paragraph [ref=f6e174]: "Production monitoring complements evals and human review once the system is running. Some failures only appear in real usage: unexpected inputs, changes in user behavior, tool failures, latency issues, cost increases, or quality degradation over time."
        - paragraph [ref=f6e175]: For this reason, agentic workflows should be monitored with both technical and business metrics, such as success rate, escalation rate, user satisfaction, cost per task, latency, or downstream business impact.
        - 'heading "Security: avoid the lethal trifecta" [level=3] [ref=f6e176]'
        - heading "Why this principle" [level=4] [ref=f6e177]
        - paragraph [ref=f6e178]:
          - text: The
          - link "lethal trifecta" [ref=f6e179] [cursor=pointer]:
            - /url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
          - text: ", a term coined by Simon Willison, occurs when an agentic system can:"
        - list [ref=f6e180]:
          - listitem [ref=f6e181]:
            - paragraph [ref=f6e182]: Access private data, such as passwords or confidential information.
          - listitem [ref=f6e183]:
            - paragraph [ref=f6e184]: Use tools that expose agents to untrusted content, such as emails or webpages.
          - listitem [ref=f6e185]:
            - paragraph [ref=f6e186]: Send information externally, for example via email or by publishing on a social network.
        - paragraph [ref=f6e187]: LLMs follow written instructions. If these instructions are placed in content that is processed by LLMs (such as text in an image, hidden text on a website, or instructions embedded in an email) the model may follow those instructions and exfiltrate confidential information, if it has access to both the information and a way to send it out.
        - paragraph [ref=f6e188]: This can happen whenever an agent reads your email, summarizes a website, or processes an image, video or audio file.
        - heading "What it implies in practice" [level=4] [ref=f6e189]
        - paragraph [ref=f6e190]: "Security must be part of the architecture from the beginning, not something added at the end. Some possible architectural implications are:"
        - blockquote [ref=f6e191]:
          - text: “
          - paragraph [ref=f6e192]: Security must be part of the architecture from the beginning, not something added at the end.
        - list [ref=f6e193]:
          - listitem [ref=f6e194]:
            - paragraph [ref=f6e195]: agents should have the minimum access required for their task;
          - listitem [ref=f6e196]:
            - paragraph [ref=f6e197]: sensitive data access should be separated from untrusted content processing when possible;
          - listitem [ref=f6e198]:
            - paragraph [ref=f6e199]: external actions should be constrained, reviewed or audited;
          - listitem [ref=f6e200]:
            - paragraph [ref=f6e201]: critical operations should require human approval;
          - listitem [ref=f6e202]:
            - paragraph [ref=f6e203]: tools should be designed so that untrusted content cannot easily control privileged actions;
          - listitem [ref=f6e204]:
            - paragraph [ref=f6e205]: prompt injection should be treated as a design problem, not only as a model behavior problem.
        - paragraph [ref=f6e206]:
          - text: I summarized some useful design patterns
          - link "in this article" [ref=f6e207] [cursor=pointer]:
            - /url: https://manuelsh.github.io/blog/2026/summary-design-patterns-secure-ai-agents/
          - text: .
        - heading "Prioritize deterministic logic versus agentic judgement" [level=3] [ref=f6e208]
        - heading "Why this principle" [level=4] [ref=f6e209]
        - paragraph [ref=f6e210]: When building AI systems, one can give AI agents tasks that could be done by deterministic logic, that is, by a simple algorithm. For tasks with explicit rules, using an LLM usually increases cost and latency, reduces predictability, and makes testing harder because outputs are probabilistic and may vary across runs or model versions.
        - paragraph [ref=f6e211]: Not every task needs an LLM.
        - heading "What it implies in practice" [level=4] [ref=f6e212]
        - paragraph [ref=f6e213]: A good architecture should make the boundary between deterministic logic and agentic judgement explicit.
        - paragraph [ref=f6e214]: Deterministic logic should be used for things such as permissions, schema validation, numerical calculations, mandatory fields, basic eligibility rules, and other cases where ordinary code is cheaper, faster and easier to test.
        - paragraph [ref=f6e215]: "LLMs and agents are most useful when the task contains ambiguity: interpreting documents, identifying weak signals, comparing strategic fit, summarizing evidence, or proposing a course of action."
        - paragraph [ref=f6e216]: For example, if we want to build a system that recommends a small set of options to every user, it may be tempting to take an LLM, provide some data about the user and the available options, and prompt it to recommend the best one.
        - paragraph [ref=f6e217]: As a first version, this may work. But it will suffer from speed, cost, unpredictability and lack of control. A better option may be to design a useful heuristic, use an AI model to infer user characteristics, or train a smaller machine learning model. There is a whole world beyond LLMs.
        - heading "Enforce a single source of truth for each type of information" [level=3] [ref=f6e218]
        - heading "Why this principle" [level=4] [ref=f6e219]
        - paragraph [ref=f6e220]: When building with AI, generating content becomes very easy. If one is careless, system documentation can quickly become duplicated.
        - paragraph [ref=f6e221]: Even in a single repository, agents may generate files like README.md, AGENTS.md or CONTRIBUTING.md, all containing information about the repository. If you do not have clear guidelines for what information goes into which file, or if you do not establish a principle of a single source of truth, duplication will appear.
        - blockquote [ref=f6e222]:
          - text: “
          - paragraph [ref=f6e223]: Over time, duplicated information may become incoherent and cause long-term problems, because it becomes the wrong context for both humans and agents.
        - heading "What it implies in practice" [level=4] [ref=f6e224]
        - paragraph [ref=f6e225]: For every important type of information, there should be a defined canonical location.
        - paragraph [ref=f6e226]: This applies not only to software development, but also to running the company. Company decisions, data definitions, business rules, documentation, architectural choices, and operational procedures should have clear places where the authoritative version lives.
        - paragraph [ref=f6e227]: Derived representations may exist, but the system should know where the source of truth is, how it is refreshed, and who owns it.
        - paragraph [ref=f6e228]: As part of the self-improvement loops, an architectural decision could be to have agents that review whether information is duplicated and, when they find duplicated or contradictory information, actively recommend the necessary changes.
        - heading "Other principles" [level=1] [ref=f6e229]
        - paragraph [ref=f6e230]:
          - text: These AI-native principles complement established engineering and MLOps practices. Also, there are many other agentic best practices in the materials (referenced before, from
          - link "OpenAI" [ref=f6e231] [cursor=pointer]:
            - /url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
          - text: and
          - link "Anthropic" [ref=f6e232] [cursor=pointer]:
            - /url: https://www.anthropic.com/engineering/building-effective-agents
          - text: ") which should be part of the building principles. They address very relevant topics such as model selection, tools, guardrails, agent orchestration, etc. and are essential. They also give a very important recommendation: start small, validate with real users, and grow capabilities over time, including the right foundations."
        - heading "Conclusion" [level=1] [ref=f6e233]
        - blockquote [ref=f6e234]:
          - text: “
          - paragraph [ref=f6e235]: Success in these types of projects relies on having the capacity to transform your company.
        - paragraph [ref=f6e236]: "An AI-native company requires the coexistence of several layers: the context layer (based on data), the self-improvement loop layer (agentic), the queryable layer (agentic), and on top of that the layer of agents that performs the business activities. Without a deliberate design and governance, this coexistence may not be “peaceful”, and there is a risk that more harm than good is done."
        - paragraph [ref=f6e237]: In fact, new agentic layers are being built in many companies. One must acknowledge that this is a learning path, and what works today may not work even in six months. So we shouldn’t be dogmatic about principles or design, and even less about specific tools, but let’s have a starting point that we can iterate from.
        - paragraph [ref=f6e238]: "Finally, system design is only one part of becoming AI-native. The other is organizational transformation: aligning leadership, roles, incentives, skills, governance, and ways of working so the technology can produce durable value. The central lesson is that the engineering and transformation tracks must be designed together, because neither succeeds alone."
